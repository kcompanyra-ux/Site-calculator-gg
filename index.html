<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Upload</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background: #f9f9f9; user-select: none; }
        h2 { color: #333; }
        input, button { padding: 12px 20px; margin: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <h2>Upload to GitHub</h2>
    <input type="file" id="fI">
    <button id="btn" onclick="u()">Upload</button>

    <script>
        // ==========================================
        // PASTE YOUR PIPEDREAM WEBHOOK URL HERE
        // ==========================================
        const PIPEDREAM_URL = "https://eom6mh8ub4ce5n.m.pipedream.net"; 
        // ==========================================

        // Anti-Inspect Protections (Right-click & F12 blocked)
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
               (e.ctrlKey && e.shiftKey && e.keyCode == 74) || (e.ctrlKey && e.keyCode == 85)) {
                document.body.innerHTML = "<h1 style='text-align:center; margin-top:20%; color:red;'>Access Denied</h1>";
                return false;
            }
        };
        setInterval(() => { debugger; }, 1e3); // Console Freezer

        // Upload Logic
        async function u() {
            const fI = document.getElementById('fI');
            const btn = document.getElementById('btn');
            
            if (fI.files.length === 0) {
                alert("Please select a file first.");
                return;
            }

            const f = fI.files[0];
            const r = new FileReader();
            btn.disabled = true;
            btn.textContent = "Uploading...";

            r.onload = async function(e) {
                // Extract base64 data
                const b = e.target.result.split(',')[1]; 
                
                try {
                    // Send JSON to Pipedream
                    const x = await fetch(PIPEDREAM_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            filename: f.name,
                            content: b
                        })
                    });

                    if (x.ok) {
                        alert("Success! File uploaded securely.");
                        fI.value = ""; 
                    } else {
                        alert("Upload failed. Check Pipedream logs.");
                    }
                } catch (err) {
                    alert("Network error: " + err.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = "Upload";
                }
            };
            
            r.readAsDataURL(f);
        }
    </script>
</body>
</html>
